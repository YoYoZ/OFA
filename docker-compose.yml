services:
  ofa:
    build: .
    restart: unless-stopped
    ports:
      - "${OFA_PORT:-3000}:3000"
    environment:
      # Everything is optional. Values are read from .env next to this file (see .env.example).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
    volumes:
      # SQLite database + generated secrets. Back up this folder.
      - ./data:/app/data
