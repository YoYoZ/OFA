<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report — Open Frame Annotator</title>
    <style>
        /* ── Screen styles (dark) ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .page { max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }
        .topbar a { color: #64b5f6; text-decoration: none; font-size: 0.88rem; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.82rem; color: #9e9e9e; }
        .controls label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
        .controls select { background: #2a2a2a; color: #e0e0e0; border: 1px solid #3a3a3a; border-radius: 4px; padding: 3px 6px; }

        .print-btn {
            padding: 8px 20px;
            background: #64b5f6;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
        }
        .print-btn:hover { background: #42a5f5; }

        .report-header {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 24px;
            margin-bottom: 24px;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
        }
        .cover { width: 200px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: #333; }
        .report-meta h1 { font-size: 1.4rem; color: #fff; margin-bottom: 6px; }
        .report-meta .description { color: #9e9e9e; font-size: 0.88rem; margin-bottom: 12px; }
        .report-meta .url a { color: #64b5f6; font-size: 0.82rem; word-break: break-all; text-decoration: none; }
        .report-meta .export-date { margin-top: 8px; font-size: 0.78rem; color: #666; }

        .stats { display: flex; gap: 10px; margin-bottom: 24px; }
        .stat-card { flex: 1; background: #2a2a2a; border-radius: 8px; padding: 12px 14px; text-align: center; }
        .stat-number { font-size: 1.7rem; font-weight: 700; color: #64b5f6; }
        .stat-number.green  { color: #52b788; }
        .stat-number.red    { color: #e74c3c; }
        .stat-number.yellow { color: #ffd700; }
        .stat-number.blue   { color: #64b5f6; }
        .stat-label  { font-size: 0.75rem; color: #9e9e9e; margin-top: 2px; }

        .section-title { font-size: 1rem; color: #fff; margin-bottom: 12px; font-weight: 600; }

        .entry {
            display: grid;
            grid-template-columns: 70px var(--thumb-w, 240px) 1fr;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #2e2e2e;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .entry.no-thumbs { grid-template-columns: 70px 1fr; }
        .tc { font-family: ui-monospace, Menlo, Consolas, monospace; color: #64b5f6; font-size: 0.82rem; white-space: nowrap; }
        .tc small { display: block; color: #666; }
        .body .author { color: #fff; font-weight: 600; font-size: 0.9rem; }
        .body .text { color: #e0e0e0; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; margin: 2px 0 6px; }
        .body .footer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .replies { margin-top: 8px; border-left: 2px solid #333; padding-left: 10px; }
        .reply { font-size: 0.82rem; color: #bbb; white-space: pre-wrap; word-break: break-word; }
        .reply b { color: #9e9e9e; font-weight: 600; }

        .sb-thumb { position: relative; display: block; overflow: hidden; border-radius: 4px; background: #111; }
        .sb-thumb img { position: absolute; max-width: none; height: auto; display: block; }
        .sb-thumb.shot img { position: static; width: 100%; height: 100%; object-fit: cover; }
        .thumb-note { font-size: 0.68rem; color: #555; margin-top: 3px; }

        .status-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
        .status-accepted { background: #1a3a2a; color: #52b788; }
        .status-rejected { background: #3a1a1a; color: #e74c3c; }
        .status-pending  { background: #2a2a1a; color: #ffd700; }
        .status-progress { background: #1a2a3a; color: #64b5f6; }
        .status-by { font-size: 0.72rem; color: #777; }
        .tag-pill { padding: 1px 7px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; color: #1a1a1a; }

        .loading { text-align: center; padding: 60px; color: #555; font-size: 1.1rem; }
        .error   { text-align: center; padding: 60px; color: #e74c3c; }
        .empty   { text-align: center; padding: 24px; color: #555; }

        /* ── Print styles ── */
        @page { margin: 14mm 12mm; }
        @media print {
            body { background: #fff; color: #111; }
            .topbar { display: none !important; }
            .page { padding: 0; max-width: 100%; }
            .report-header { background: #f5f5f5; border: 1px solid #ddd; }
            .report-meta h1, .section-title, .body .author { color: #111; }
            .report-meta .description, .stat-label, .reply b { color: #555; }
            .report-meta .url a, .tc, .stat-number { color: #1a6fa5; }
            .stat-card { background: #f5f5f5; border: 1px solid #ddd; }
            .stat-number.green  { color: #2d6a4f; }
            .stat-number.red    { color: #922b21; }
            .stat-number.yellow { color: #9a7d0a; }
            .entry { border-bottom-color: #ddd; }
            .body .text { color: #222; }
            .reply { color: #333; }
            .replies { border-left-color: #ccc; }
            .status-accepted { background: #e8f5e9; color: #2d6a4f; }
            .status-rejected { background: #fde8e8; color: #922b21; }
            .status-pending  { background: #fffde7; color: #9a7d0a; }
            .status-progress { background: #e3f2fd; color: #1a6fa5; }
            .tag-pill { border: 1px solid #ccc; color: #333; background: #f5f5f5 !important; }
            .thumb-note { color: #999; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a id="backLink" href="#">← Back to project</a>
            <div class="controls">
                <span id="statusToggles"></span>
                <label><input type="checkbox" id="showReplies" checked> Replies</label>
                <label>Frames
                    <select id="thumbSize">
                        <option value="0">none</option>
                        <option value="160">small</option>
                        <option value="240" selected>medium</option>
                        <option value="320">large</option>
                    </select>
                </label>
                <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading report…</div>
        </div>
    </div>

    <script src="/common.js"></script>
    <script>
        const projectId = decodeURIComponent(window.location.pathname.split('/')[2]);
        document.getElementById('backLink').href = `/project/${encodeURIComponent(projectId)}`;

        const prefs = Object.assign({ statuses: [0, 3, 1, 2], replies: true, thumb: 240 }, lsGet('ofa_report', {}));
        let data = null;
        let storyboard = null;

        function statusBadge(status) {
            const s = STATUS[status || 0];
            return `<span class="status-badge status-${s.key}">${s.icon} ${s.label}</span>`;
        }

        function tagPills(tagsJson, config) {
            return parseTags(tagsJson).map(t =>
                `<span class="tag-pill" style="background:${tagColor(t, config)}">${escapeHtml(t)}</span>`).join('');
        }

        function setupControls() {
            document.getElementById('statusToggles').innerHTML = STATUS_ORDER.map(code =>
                `<label><input type="checkbox" data-status="${code}" ${prefs.statuses.includes(code) ? 'checked' : ''}> ${STATUS[code].label}</label>`
            ).join(' ');
            document.getElementById('showReplies').checked = prefs.replies;
            document.getElementById('thumbSize').value = String(prefs.thumb);
            document.querySelector('.controls').addEventListener('change', () => {
                prefs.statuses = [...document.querySelectorAll('[data-status]:checked')].map(i => Number(i.dataset.status));
                prefs.replies = document.getElementById('showReplies').checked;
                prefs.thumb = Number(document.getElementById('thumbSize').value);
                lsSet('ofa_report', prefs);
                render();
            });
        }

        function render() {
            const content = document.getElementById('content');
            const { project, annotations } = data;
            const tagsConfig = parseTags(project.tags_config);
            const roots   = annotations.filter(a => !a.parent_id);
            const replies = (id) => annotations.filter(a => a.parent_id === id);
            const count = (code) => roots.filter(a => (a.status || 0) === code).length;
            const shown = roots.filter(a => prefs.statuses.includes(a.status || 0));

            const videoId = extractVideoId(project.youtube_url);
            const cover = videoId
                ? `<img class="cover" src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" alt="" onerror="this.style.visibility='hidden'">`
                : '<div class="cover"></div>';

            const thumbW = prefs.thumb;
            const entries = shown.map(a => {
                const thumb = thumbW ? thumbnailHtml(a, storyboard, thumbW) : '';
                const note = thumbW && thumb ? `<div class="thumb-note">${a.has_screenshot ? 'exact frame' : 'approx. frame'}</div>` : '';
                const replyHtml = prefs.replies && replies(a.id).length
                    ? `<div class="replies">${replies(a.id).map(r => `<div class="reply"><b>${escapeHtml(r.author)}:</b> ${escapeHtml(r.text)}</div>`).join('')}</div>`
                    : '';
                return `
                    <div class="entry ${thumbW ? '' : 'no-thumbs'}" style="--thumb-w:${thumbW}px">
                        <div class="tc">${escapeHtml(formatTime(a.timecode))}${a.timecode_end != null ? `<small>→ ${escapeHtml(formatTime(a.timecode_end))}</small>` : ''}</div>
                        ${thumbW ? `<div>${thumb || ''}${note}</div>` : ''}
                        <div class="body">
                            <div class="author">${escapeHtml(a.author)}</div>
                            <div class="text">${escapeHtml(a.text)}</div>
                            <div class="footer">
                                ${statusBadge(a.status)}
                                ${a.status && a.status_by ? `<span class="status-by">by ${escapeHtml(a.status_by)}</span>` : ''}
                                ${tagPills(a.tags, tagsConfig)}
                            </div>
                            ${replyHtml}
                        </div>
                    </div>`;
            }).join('');

            content.innerHTML = `
                <div class="report-header">
                    ${cover}
                    <div class="report-meta">
                        <h1>${escapeHtml(project.title || 'Untitled Project')}</h1>
                        ${project.description ? `<p class="description">${escapeHtml(project.description)}</p>` : ''}
                        <p class="url"><a href="${escapeHtml(project.youtube_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(project.youtube_url)}</a></p>
                        <p class="export-date">Exported ${escapeHtml(new Date().toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' }))}</p>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-card"><div class="stat-number">${roots.length}</div><div class="stat-label">Total</div></div>
                    <div class="stat-card"><div class="stat-number yellow">${count(0)}</div><div class="stat-label">Pending</div></div>
                    <div class="stat-card"><div class="stat-number blue">${count(3)}</div><div class="stat-label">In progress</div></div>
                    <div class="stat-card"><div class="stat-number green">${count(1)}</div><div class="stat-label">Accepted</div></div>
                    <div class="stat-card"><div class="stat-number red">${count(2)}</div><div class="stat-label">Rejected</div></div>
                </div>

                <p class="section-title">Comments${shown.length !== roots.length ? ` (${shown.length} of ${roots.length})` : ''}</p>
                ${entries || '<div class="empty">No comments to show</div>'}
            `;
        }

        (async () => {
            setupControls();
            try {
                data = await api('GET', `/api/projects/${encodeURIComponent(projectId)}`, undefined, { projectId });
                document.title = `${data.project.title || 'Report'} — Open Frame Annotator`;
                render();
                storyboard = await Storyboard.load(projectId);
                if (storyboard) render();
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="error">Error loading report: ${escapeHtml(err.message)}</div>`;
            }
        })();
    </script>
</body>
</html>
